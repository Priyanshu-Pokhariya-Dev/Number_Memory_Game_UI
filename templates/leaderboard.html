<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Number Memory Game</title>
    <link rel="stylesheet" href="/static/style.css?v=800">
</head>
<body>
    <div class="main-container">
        <div class="glass-card" style="max-width: 600px;">
            <div class="header">
                <h1 class="title">Leaderboard</h1>
                <p style="color: #666; margin-bottom: 20px;">Top Players by Highest Marks</p>
            </div>

            <div class="leaderboard-table-wrapper">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player Name</th>
                            <th>Marks</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{ leaderboard_rows }}
                    </tbody>
                </table>
            </div>

            <div id="no-players-msg" style="display: none; margin: 20px 0;">
                <p>No players yet. Be the first to play!</p>
            </div>

            <div style="margin-top: 30px;">
                <a href="/" class="heavy-btn" style="text-decoration: none;">Play Game</a>
            </div>
        </div>
    </div>

    <script>
        const tbody = document.querySelector('tbody');
        if (!tbody || tbody.innerText.trim() === "") {
            document.querySelector('.leaderboard-table-wrapper').style.display = 'none';
            document.getElementById('no-players-msg').style.display = 'block';
        }
    </script>
</body>
</html>
