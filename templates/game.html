<!DOCTYPE html>
<html>

<head>
    <title>Memory Game</title>
    <link rel="stylesheet" href="/static/style.css?v=700">
</head>

<body>

    <a href="/" class="back-btn">BACK</a>

    <div class="main-container">
        <div class="glass-card" id="game-card">

            <h2 id="feedback"></h2>
            <h3 style="color:#666; margin-bottom: 5px;">
                Player: {{ player_name }}
            </h3>
            <h4 id="lvl-txt">
                Level: <span id="lvl-val">{{ level }}</span>
            </h4>

            <div id="display-box">
                <p id="number-display">Get Ready...</p>
            </div>

            <form id="game-form" style="display:none;">
                <input type="text" id="user_input" name="user_input" placeholder="Enter sequence (space separated)"
                    autocomplete="off">
                <button type="submit" class="heavy-btn"
                    style="margin-top:15px; width:100%; border:none; cursor:pointer;">
                    Submit
                </button>
            </form>

            <div id="result-screen"></div>
        </div>
    </div>

    <script>
        /* ---------------- AI DATA ---------------- */
        let sequence = "{{ sequence }}".split(",");
        let speed = {{ speed }};

        const display = document.getElementById("number-display");
        const form = document.getElementById("game-form");
        const feedback = document.getElementById("feedback");
        const card = document.getElementById("game-card");

        /* ---------------- PLAY SEQUENCE ---------------- */
        function play() {
            let i = 0;
            form.style.display = "none";
            feedback.innerText = "";

            function showNext() {
                if (i >= sequence.length) {
                    display.innerText = "GO!";
                    form.style.display = "block";
                    document.getElementById("user_input").focus();
                    return;
                }

                display.innerText = "";
                setTimeout(() => {
                    display.innerText = sequence[i++];
                    setTimeout(showNext, speed);
                }, 300);
            }

            showNext();
        }

        /* ---------------- SUBMIT ANSWER ---------------- */
        form.onsubmit = async (e) => {
            e.preventDefault();
            feedback.innerText = "";

            let formData = new FormData(form);

            let res = await fetch("/submit-answer/{{ player_name }}", {
                method: "POST",
                body: formData
            });

            let data = await res.json();

            if (data.success) {
                // ✅ AI PRAISE MESSAGE HERE
                feedback.innerText = data.message || "Correct!";
                feedback.style.color = "green";

                document.getElementById("lvl-val").innerText = data.level;
                sequence = data.sequence.split(",");
                speed = data.speed;

                document.getElementById("user_input").value = "";
                setTimeout(play, 1000);

            } else {
                card.innerHTML = `
            <h1 style="color:red; margin-bottom:20px;">Game Over</h1>

            <div class="info-box">
                <p><strong>Your Input:</strong>
                    <span style="color:red; font-weight:bold;">
                        ${data.user || "None"}
                    </span>
                </p>

                <p><strong>Correct Sequence:</strong>
                    <span style="color:green; font-weight:bold;">
                        ${data.correct}
                    </span>
                </p>

                <p style="margin-top:10px; color:#6c5ce7; font-weight:bold;">
                    🤖 AI Tip: ${data.feedback}
                </p>
            </div>

            <h2 style="margin:20px 0; font-size: 32px;">
                Final Score: ${data.score}
            </h2>

            <div style="display:flex; gap:10px;">
                <a href="/name-input" class="heavy-btn" style="flex:1; text-decoration:none;">
                    Retry
                </a>
                <a href="/leaderboard" class="heavy-btn"
                   style="flex:1; text-decoration:none; background:black !important;">
                    Leaderboard
                </a>
            </div>
        `;
            }
        };

        /* ---------------- START GAME ---------------- */
        play();
    </script>

</body>

</html>
